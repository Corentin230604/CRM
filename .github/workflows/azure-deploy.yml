name: Déployer sur Azure (en pause)

# EN PAUSE : ce déploiement ne se lance plus automatiquement.
# Pour le réactiver, remettez le bloc « push / pull_request » ci-dessous à la place de « workflow_dispatch ».
#   push:
#     branches: [main]
#   pull_request:
#     types: [opened, synchronize, reopened, closed]
#     branches: [main]
on:
  workflow_dispatch:

jobs:
  test:
    if: github.event_name == 'push' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tests de l'API
        working-directory: api
        run: npm ci && npm test
      - name: Tests et compilation de l'interface
        working-directory: web
        run: npm ci && npm test && npm run build

  deploy:
    # Ne s'exécute que lorsque le site Azure est relié au dépôt (secret ajouté par « az staticwebapp create »).
    if: (github.event_name == 'push' || github.event.action != 'closed')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier que le déploiement est configuré
        id: check
        run: echo "ready=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Compiler et déployer sur Azure Static Web Apps
        if: steps.check.outputs.ready == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: web
          api_location: api
          output_location: dist

  close_preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier que le déploiement est configuré
        id: check
        run: echo "ready=${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Fermer l'aperçu
        if: steps.check.outputs.ready == 'true'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
